name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: orfina
          POSTGRES_USER: orfina
          POSTGRES_PASSWORD: orfina
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U orfina -d orfina"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgresql://orfina:orfina@localhost:5432/orfina?schema=public
      JWT_SECRET: ci-only-secret-not-for-production
      FRONTEND_URLS: http://localhost:4200
      EVENTS_ENABLED: "false"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - run: npm run prisma:generate
      - run: npx prisma migrate deploy
      - run: npm run lint
      - run: npm test
      - run: npm run test:integration
      - run: npm run build
