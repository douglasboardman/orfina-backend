services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: orfina
      POSTGRES_USER: orfina
      POSTGRES_PASSWORD: orfina
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
  nats:
    image: nats:2.10-alpine
    command: ["-js", "-m", "8222"]
    ports:
      - "4222:4222"
      - "8222:8222"
volumes:
  postgres_data:
